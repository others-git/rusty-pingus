<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rusty Pingus: a rust-colored penguin with an "up" pulse across the belly.
       Source of truth for favicon.ico / icon.png / apple-touch-icon.png
       (regenerate with rsvg-convert; see environment/unraid + index.html). -->
  <rect width="512" height="512" rx="100" fill="#0f172a"/>
  <!-- flippers -->
  <ellipse cx="122" cy="310" rx="26" ry="86" fill="#7c2d12" transform="rotate(20 122 310)"/>
  <ellipse cx="390" cy="310" rx="26" ry="86" fill="#7c2d12" transform="rotate(-20 390 310)"/>
  <!-- feet -->
  <ellipse cx="212" cy="452" rx="36" ry="15" fill="#f59e0b"/>
  <ellipse cx="300" cy="452" rx="36" ry="15" fill="#f59e0b"/>
  <!-- head + body -->
  <circle cx="256" cy="168" r="88" fill="#b7410e"/>
  <ellipse cx="256" cy="312" rx="124" ry="138" fill="#b7410e"/>
  <!-- belly -->
  <ellipse cx="256" cy="330" rx="84" ry="104" fill="#ffedd5"/>
  <!-- eyes -->
  <circle cx="224" cy="152" r="20" fill="#ffffff"/>
  <circle cx="288" cy="152" r="20" fill="#ffffff"/>
  <circle cx="229" cy="156" r="9" fill="#2a1205"/>
  <circle cx="283" cy="156" r="9" fill="#2a1205"/>
  <!-- beak -->
  <polygon points="234,184 278,184 256,212" fill="#f59e0b"/>
  <!-- pulse line ("up" green) -->
  <polyline points="186,330 226,330 242,296 262,366 278,316 290,330 326,330"
            fill="none" stroke="#22c55e" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
