<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor — Rusty Pingus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { slate: { 950: '#020617' } }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <!-- Apache ECharts: built-in dataZoom (wheel/drag/slider) + markArea for downtime; pinned. -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script>try{var t=localStorage.getItem('theme');if(t&&t!=='default')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/themes.css" />
  <script defer src="/theme.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased" x-data="monitorDetail()">

  <!-- Header -->
  <header class="sticky top-0 z-10 bg-slate-900 border-b border-slate-700 shadow-lg">
    <div class="max-w-5xl mx-auto px-6 py-3 flex items-center gap-4">
      <a href="/" class="text-cyan-400 hover:text-cyan-300 transition-colors text-sm">
        <i class="fa-solid fa-arrow-left mr-1"></i> Dashboard
      </a>
      <span class="text-slate-600">|</span>
      <span class="text-lg font-bold tracking-tight" x-text="monitorName"></span>

      <div class="flex items-center gap-2 ml-2" x-show="currentStatus">
        <span x-show="currentStatus === 'up'" class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400"></span>
        </span>
        <span x-show="currentStatus === 'down'" class="relative flex h-2.5 w-2.5">
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-400"></span>
        </span>
        <span class="text-xs font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full"
              :class="{
                'bg-emerald-400/10 text-emerald-400': currentStatus === 'up',
                'bg-red-400/10 text-red-400': currentStatus === 'down',
                'bg-amber-400/10 text-amber-400': currentStatus === 'pending' || !currentStatus
              }"
              x-text="currentStatus || 'pending'">
        </span>
      </div>

      <!-- Type-specific detail (e.g. current public IP, border fault class) -->
      <span x-show="detail" x-cloak
            class="inline-flex items-center gap-1 ml-1 px-2 py-0.5 rounded-full bg-cyan-400/10 text-cyan-300 text-xs"
            :title="detail">
        <i class="fa-solid fa-circle-info text-cyan-500/70"></i>
        <span x-text="detail"></span>
      </span>
    </div>
  </header>

  <!-- Loading -->
  <div x-show="loading" class="flex items-center justify-center py-24 text-slate-500">
    <i class="fa-solid fa-circle-notch fa-spin mr-3"></i> Loading…
  </div>

  <main x-show="!loading"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        class="max-w-5xl mx-auto px-6 py-8 flex flex-col gap-6">

    <!-- ── Public-IP metrics strip (purpose-built: track the external IP) ──── -->
    <section x-show="timelineKind === 'publicip'" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
        <div class="text-xs text-slate-500 uppercase tracking-wide mb-1">Current IP</div>
        <div class="text-xl font-bold font-mono truncate"
             :class="ipCurrent ? 'text-cyan-300' : 'text-amber-400'"
             :title="ipCurrent || 'unreachable'"
             x-text="ipCurrent || 'unreachable'"></div>
      </div>
      <div class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
        <div class="text-xs text-slate-500 uppercase tracking-wide mb-1">Stable for</div>
        <div class="text-xl font-bold text-slate-100" x-text="ipStableFor"></div>
      </div>
      <div class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
        <div class="text-xs text-slate-500 uppercase tracking-wide mb-1" x-text="'IP changes (' + activeWindow + ')'"></div>
        <div class="text-xl font-bold"
             :class="ipChanges > 0 ? 'text-amber-400' : 'text-slate-100'"
             x-text="ipChanges.toLocaleString()"></div>
      </div>
      <div class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
        <div class="text-xs text-slate-500 uppercase tracking-wide mb-1">Last check</div>
        <div class="text-xl font-bold text-slate-100" x-text="lastCheckedAt ? formatRelative(lastCheckedAt) : '—'"></div>
      </div>
    </section>

    <!-- ── Metrics strip (data-first) ─────────────────────────────────────── -->
    <section x-show="timelineKind !== 'publicip'" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
        <div class="text-xs text-slate-500 uppercase tracking-wide mb-1" x-text="timelineKind === 'border' ? 'Upstream RTT' : 'Last response'"></div>
        <div class="text-xl font-bold text-slate-100" x-text="lastResponseMs != null ? lastResponseMs + ' ms' : '—'"></div>
      </div>
      <div class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
        <div class="text-xs text-slate-500 uppercase tracking-wide mb-1">Uptime 24h</div>
        <div class="text-xl font-bold"
             :class="{
               'text-emerald-400': uptime24h != null && uptime24h >= 99,
               'text-amber-400': uptime24h != null && uptime24h >= 90 && uptime24h < 99,
               'text-red-400': uptime24h != null && uptime24h < 90,
               'text-slate-500': uptime24h == null
             }"
             x-text="uptime24h != null ? uptime24h.toFixed(2) + '%' : '—'"></div>
      </div>
      <div class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
        <div class="text-xs text-slate-500 uppercase tracking-wide mb-1">Last check</div>
        <div class="text-xl font-bold text-slate-100" x-text="lastCheckedAt ? formatRelative(lastCheckedAt) : '—'"></div>
      </div>
      <div class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
        <div class="text-xs text-slate-500 uppercase tracking-wide mb-1" x-text="'Samples (' + activeWindow + ')'"></div>
        <div class="text-xl font-bold text-slate-100" x-text="sampleCount.toLocaleString()"></div>
      </div>
    </section>

    <!-- ── Uptime windows (clickable selectors that set the chart range) ──── -->
    <section class="bg-slate-800 border border-slate-700 rounded-xl p-5">
      <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-400 mb-4">Uptime — click to set chart range</h2>
      <div class="flex flex-wrap gap-6 justify-around">
        <template x-for="w in uptimeWindows" :key="w.label">
          <button type="button" @click="selectWindow(w.label)"
                  class="flex flex-col items-center gap-2 rounded-xl p-2 transition-all focus:outline-none"
                  :class="activeWindow === w.label ? 'ring-2 ring-cyan-500 bg-slate-900' : 'hover:bg-slate-900/60'">
            <div class="relative w-20 h-20">
              <svg class="w-20 h-20 -rotate-90" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" fill="none" stroke="#1e293b" stroke-width="8" />
                <circle cx="50" cy="50" r="40" fill="none"
                        :stroke="gaugeColor(w.value)" stroke-width="8" stroke-linecap="round"
                        :stroke-dasharray="251.2" :stroke-dashoffset="gaugeOffset(w.value)"
                        class="transition-all duration-700 ease-out" />
              </svg>
              <div class="absolute inset-0 flex items-center justify-center">
                <span class="text-sm font-bold"
                      :class="{
                        'text-emerald-400': w.value != null && w.value >= 99,
                        'text-amber-400': w.value != null && w.value >= 90 && w.value < 99,
                        'text-red-400': w.value != null && w.value < 90,
                        'text-slate-500': w.value == null
                      }"
                      x-text="w.value != null ? w.value.toFixed(1) + '%' : '—'"></span>
              </div>
            </div>
            <span class="text-xs font-medium"
                  :class="activeWindow === w.label ? 'text-cyan-400' : 'text-slate-400'"
                  x-text="w.label"></span>
          </button>
        </template>
      </div>
    </section>

    <!-- ── Response time chart (primary) ──────────────────────────────────── -->
    <section class="bg-slate-900 border border-slate-700 rounded-xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-400 flex items-center gap-2">
          <span x-text="timelineKind === 'publicip' ? 'Public IP' : (timelineKind === 'border' ? 'Border Status' : 'Response Time')"></span>
          <span class="text-slate-600" x-text="'· ' + activeWindow"></span>
          <span x-show="!timelineKind && chartMode === 'raw'" class="text-cyan-500/70 normal-case tracking-normal">(raw)</span>
          <span x-show="isLoadingDetail" class="text-slate-500 normal-case tracking-normal">
            <i class="fa-solid fa-circle-notch fa-spin"></i> updating…
          </span>
        </h2>
        <div class="flex items-center gap-3 text-xs text-slate-500">
          <span class="hidden sm:inline"><i class="fa-solid fa-arrows-left-right-to-line mr-1"></i>scroll to zoom · drag to pan · slider below</span>
          <button type="button" @click="resetZoom()"
                  class="px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300 hover:text-cyan-400 transition-colors">
            <i class="fa-solid fa-arrows-rotate mr-1"></i>Reset
          </button>
        </div>
      </div>
      <div id="response-chart" class="echart"></div>
      <div x-show="!hasData && !isLoadingDetail" class="text-slate-500 text-sm py-6 text-center">No data in this window.</div>
      <!-- Response-time loss summary (line-chart monitors only) -->
      <div x-show="!timelineKind && lossCount > 0" class="mt-3 text-xs text-slate-500 flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-400"></span>
        <span x-text="(chartMode === 'raw' ? lossCount + ' lost probe' + (lossCount === 1 ? '' : 's') : lossCount + ' interval' + (lossCount === 1 ? '' : 's') + ' with loss') + ' in view'"></span>
      </div>
      <!-- State-timeline legend: each color's value (IP / fault class) and time in effect -->
      <div x-show="timelineKind && tlLegend.length" class="mt-4 flex flex-wrap gap-x-5 gap-y-2 text-xs">
        <template x-for="entry in tlLegend" :key="entry.label">
          <div class="flex items-center gap-2">
            <span class="inline-block w-3 h-3 rounded-sm" :style="`background:${entry.color}`"></span>
            <span class="text-slate-300" :class="timelineKind === 'publicip' ? 'font-mono' : ''" x-text="entry.label"></span>
            <span class="text-slate-500" x-text="'· ' + fmtLegendDuration(entry.ms)"></span>
          </div>
        </template>
      </div>
    </section>

  </main>

  <script src="/monitor.js"></script>
</body>
</html>
