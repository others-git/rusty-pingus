<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor — Rusty Pingus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { slate: { 950: '#020617' } }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased" x-data="monitorDetail()">

  <!-- Header -->
  <header class="sticky top-0 z-10 bg-slate-900 border-b border-slate-700 shadow-lg">
    <div class="max-w-4xl mx-auto px-6 py-3 flex items-center gap-4">
      <a href="/" class="text-cyan-400 hover:text-cyan-300 transition-colors text-sm">
        <i class="fa-solid fa-arrow-left mr-1"></i> Dashboard
      </a>
      <span class="text-slate-600">|</span>
      <span class="text-lg font-bold tracking-tight" x-text="monitorName"></span>

      <!-- Status badge + pulse in header -->
      <div class="flex items-center gap-2 ml-2" x-show="currentStatus">
        <span x-show="currentStatus === 'up'" class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400"></span>
        </span>
        <span x-show="currentStatus === 'down'" class="relative flex h-2.5 w-2.5">
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-400"></span>
        </span>
        <span class="text-xs font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full"
              :class="{
                'bg-emerald-400/10 text-emerald-400': currentStatus === 'up',
                'bg-red-400/10 text-red-400': currentStatus === 'down',
                'bg-amber-400/10 text-amber-400': currentStatus === 'pending' || !currentStatus
              }"
              x-text="currentStatus || 'pending'">
        </span>
      </div>
    </div>
  </header>

  <!-- Loading -->
  <div x-show="loading" class="flex items-center justify-center py-24 text-slate-500">
    <i class="fa-solid fa-circle-notch fa-spin mr-3"></i> Loading…
  </div>

  <main x-show="!loading"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        class="max-w-4xl mx-auto px-6 py-8 flex flex-col gap-6">

    <!-- Uptime gauges -->
    <section class="bg-slate-800 border border-slate-700 rounded-xl p-6">
      <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-400 mb-5">Uptime</h2>
      <div class="flex flex-wrap gap-8 justify-around">

        <template x-for="w in uptimeWindows" :key="w.label">
          <div class="flex flex-col items-center gap-2">
            <!-- SVG gauge ring -->
            <div class="relative w-24 h-24">
              <svg class="w-24 h-24 -rotate-90" viewBox="0 0 100 100">
                <!-- Track -->
                <circle cx="50" cy="50" r="40" fill="none" stroke="#1e293b" stroke-width="8" />
                <!-- Arc -->
                <circle cx="50" cy="50" r="40" fill="none"
                        :stroke="gaugeColor(w.value)"
                        stroke-width="8"
                        stroke-linecap="round"
                        :stroke-dasharray="251.2"
                        :stroke-dashoffset="gaugeOffset(w.value)"
                        class="transition-all duration-700 ease-out" />
              </svg>
              <!-- Label inside ring -->
              <div class="absolute inset-0 flex items-center justify-center">
                <span class="text-sm font-bold"
                      :class="{
                        'text-emerald-400': w.value != null && w.value >= 99,
                        'text-amber-400': w.value != null && w.value >= 90 && w.value < 99,
                        'text-red-400': w.value != null && w.value < 90,
                        'text-slate-500': w.value == null
                      }"
                      x-text="w.value != null ? w.value.toFixed(1) + '%' : '—'">
                </span>
              </div>
            </div>
            <span class="text-xs text-slate-400 font-medium" x-text="w.label"></span>
          </div>
        </template>

      </div>
    </section>

    <!-- Response time chart -->
    <section class="bg-slate-900 border border-slate-700 rounded-xl p-6">
      <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-400 mb-4">Response Time (last 24h)</h2>
      <div class="chart-canvas-wrap">
        <canvas id="response-chart"></canvas>
      </div>
    </section>

    <!-- Probe history table -->
    <section class="bg-slate-800 border border-slate-700 rounded-xl p-6">
      <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-400 mb-4">Probe History</h2>

      <div x-show="history.length === 0" class="text-slate-500 text-sm py-6 text-center">No results yet.</div>

      <div x-show="history.length > 0" class="overflow-x-auto">
        <table class="w-full text-sm border-collapse">
          <thead>
            <tr class="border-b border-slate-700">
              <th class="text-left py-2 px-3 text-xs font-medium text-slate-400">Time</th>
              <th class="text-left py-2 px-3 text-xs font-medium text-slate-400">Status</th>
              <th class="text-left py-2 px-3 text-xs font-medium text-slate-400">Response</th>
              <th class="text-left py-2 px-3 text-xs font-medium text-slate-400">Reason</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(row, i) in history" :key="row.id">
              <tr :class="i % 2 === 0 ? 'bg-slate-800' : 'bg-slate-900'">
                <td class="py-2 px-3 text-slate-300 text-xs" x-text="formatTime(row.checked_at)"></td>
                <td class="py-2 px-3">
                  <span class="text-xs font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full"
                        :class="{
                          'bg-emerald-400/10 text-emerald-400': row.status === 'up',
                          'bg-red-400/10 text-red-400': row.status === 'down'
                        }"
                        x-text="row.status">
                  </span>
                </td>
                <td class="py-2 px-3 text-slate-400 text-xs" x-text="row.response_time_ms != null ? row.response_time_ms + 'ms' : '—'"></td>
                <td class="py-2 px-3 text-slate-500 text-xs" x-text="row.failure_reason || '—'"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="/monitor.js"></script>
</body>
</html>
