<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rusty Pingus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { slate: { 950: '#020617' } }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased" x-data="dashboard()" @keydown.escape.window="showAddModal = false; pendingDelete = null">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-10 bg-slate-900 border-b border-slate-700 shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center gap-4">
      <span class="text-lg font-bold text-slate-100 tracking-tight">
        <i class="fa-solid fa-satellite-dish text-cyan-400 mr-2"></i>Rusty Pingus
      </span>
      <div class="ml-auto flex items-center gap-6 text-sm">
        <span x-show="!loading" x-transition>
          <span class="text-emerald-400 font-semibold" x-text="upCount"></span>
          <span class="text-slate-400"> / <span x-text="monitors.length"></span> Up</span>
        </span>
        <span x-show="!loading && downCount > 0" x-transition>
          <span class="text-red-400 font-semibold" x-text="downCount + ' Down'"></span>
        </span>
        <span class="text-slate-500 text-xs" x-text="lastUpdated ? 'Updated ' + lastUpdated : ''" x-show="lastUpdated"></span>
        <!-- Add Monitor button -->
        <button @click="showAddModal = true"
                class="flex items-center gap-2 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded-lg transition-colors">
          <i class="fa-solid fa-plus"></i> Add Monitor
        </button>
      </div>
    </div>
  </header>

  <!-- Main dashboard -->
  <main class="max-w-7xl mx-auto px-6 py-8">

    <div x-show="loading" class="flex items-center justify-center py-24 text-slate-500">
      <i class="fa-solid fa-circle-notch fa-spin mr-3"></i> Loading monitors…
    </div>

    <div x-show="!loading && monitors.length === 0" class="text-center py-24 text-slate-500">
      <i class="fa-solid fa-satellite-dish text-4xl mb-4 block text-slate-700"></i>
      No monitors yet.
      <button @click="showAddModal = true" class="text-cyan-400 hover:text-cyan-300 underline ml-1">Add your first monitor</button>
    </div>

    <!-- Monitor grid -->
    <div x-show="!loading && monitors.length > 0"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

      <template x-for="m in monitors" :key="m.name">
        <div class="group relative bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-md hover:border-cyan-500 hover:shadow-cyan-950 transition-all duration-200"
             :class="{
               'border-l-4 border-l-emerald-500': m.status === 'up',
               'border-l-4 border-l-red-500': m.status === 'down',
               'border-l-4 border-l-amber-500': !m.status || m.status === 'pending'
             }">

          <!-- Delete button (shown on hover) -->
          <button @click.stop="pendingDelete = m.name"
                  class="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity text-slate-500 hover:text-red-400 p-1 rounded"
                  title="Delete monitor">
            <i class="fa-solid fa-trash text-xs"></i>
          </button>

          <!-- Clickable area -->
          <a :href="'/monitors/' + encodeURIComponent(m.name)" class="block no-underline text-inherit">
            <div class="flex items-center gap-3 mb-3">
              <span class="text-cyan-400 text-sm w-5 text-center">
                <i :class="protocolIcon(m.protocol)"></i>
              </span>
              <span class="font-semibold text-slate-100 flex-1 truncate text-sm pr-4" x-text="m.name"></span>
              <div class="flex items-center gap-2">
                <span x-show="m.status === 'up'" class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400"></span>
                </span>
                <span x-show="m.status === 'down'" class="relative flex h-2.5 w-2.5">
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-400"></span>
                </span>
                <span x-show="!m.status || m.status === 'pending'" class="relative flex h-2.5 w-2.5">
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-400"></span>
                </span>
                <span class="text-xs font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full"
                      :class="{
                        'bg-emerald-400/10 text-emerald-400': m.status === 'up',
                        'bg-red-400/10 text-red-400': m.status === 'down',
                        'bg-amber-400/10 text-amber-400': !m.status || m.status === 'pending'
                      }"
                      x-text="m.status || 'pending'">
                </span>
              </div>
            </div>
            <div class="text-xs text-slate-400 truncate mb-3" x-text="m.endpoint"></div>
            <div class="flex gap-4 text-xs text-slate-400 mb-2">
              <span>
                <i class="fa-solid fa-bolt text-slate-600 mr-1"></i>
                <span x-text="m.response_time_ms != null ? m.response_time_ms + 'ms' : '—'"></span>
              </span>
              <span>
                <i class="fa-solid fa-chart-line text-slate-600 mr-1"></i>
                <span x-text="m.uptime_24h != null ? m.uptime_24h.toFixed(2) + '% (24h)' : '—'"></span>
              </span>
            </div>
            <div class="text-xs text-slate-600" x-text="m.last_checked_at ? 'Checked ' + formatRelative(m.last_checked_at) : 'Not yet checked'"></div>
          </a>
        </div>
      </template>
    </div>
  </main>

  <!-- ── Delete confirmation dialog ─────────────────────────────────────── -->
  <div x-cloak x-show="pendingDelete" x-transition class="fixed inset-0 z-50 flex items-center justify-center bg-black/60">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl max-w-sm w-full mx-4">
      <h3 class="text-base font-semibold text-slate-100 mb-2">Delete monitor?</h3>
      <p class="text-sm text-slate-400 mb-5">
        <span class="text-slate-200 font-medium" x-text="pendingDelete"></span> will be permanently removed.
      </p>
      <div class="flex gap-3 justify-end">
        <button @click="pendingDelete = null"
                class="px-4 py-2 text-sm text-slate-400 hover:text-slate-200 transition-colors">
          Cancel
        </button>
        <button @click="deleteMonitor(pendingDelete)"
                class="px-4 py-2 text-sm bg-red-600 hover:bg-red-500 text-white rounded-lg font-medium transition-colors">
          Delete
        </button>
      </div>
    </div>
  </div>

  <!-- ── Add Monitor modal ───────────────────────────────────────────────── -->
  <div x-cloak x-show="showAddModal" x-transition class="fixed inset-0 z-50 flex items-center justify-center bg-black/60"
       @click.self="showAddModal = false">
    <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-700">
        <h2 class="text-base font-semibold text-slate-100">Add Monitor</h2>
        <button @click="showAddModal = false" class="text-slate-400 hover:text-slate-200 transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-6">
        <!-- Protocol tabs -->
        <div class="flex gap-1 mb-5 bg-slate-900 rounded-lg p-1">
          <template x-for="proto in ['http', 'tcp', 'icmp']" :key="proto">
            <button @click="form.protocol = proto; formErrors = {}"
                    class="flex-1 py-1.5 text-xs font-semibold rounded-md transition-colors capitalize"
                    :class="form.protocol === proto
                      ? 'bg-cyan-600 text-white'
                      : 'text-slate-400 hover:text-slate-200'">
              <span x-text="proto.toUpperCase()"></span>
            </button>
          </template>
        </div>

        <form @submit.prevent="submitMonitor()" class="flex flex-col gap-4">

          <!-- Name (all protocols) -->
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Monitor Name</label>
            <input x-model="form.name" type="text" placeholder="my-api"
                   class="w-full bg-slate-900 border rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                   :class="formErrors.name ? 'border-red-500' : 'border-slate-700'" />
            <p x-show="formErrors.name" x-text="formErrors.name" class="text-red-400 text-xs mt-1"></p>
          </div>

          <!-- HTTP fields -->
          <div x-show="form.protocol === 'http'" class="flex flex-col gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">URL</label>
              <input x-model="form.url" type="url" placeholder="https://example.com"
                     class="w-full bg-slate-900 border rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                     :class="formErrors.url ? 'border-red-500' : 'border-slate-700'" />
              <p x-show="formErrors.url" x-text="formErrors.url" class="text-red-400 text-xs mt-1"></p>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Method</label>
                <select x-model="form.method" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                  <option>GET</option><option>POST</option><option>HEAD</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Expected Status <span class="text-slate-600">(optional)</span></label>
                <input x-model.number="form.expected_status" type="number" placeholder="200"
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
              </div>
            </div>
          </div>

          <!-- TCP fields -->
          <div x-show="form.protocol === 'tcp'" class="flex flex-col gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Host</label>
              <input x-model="form.host" type="text" placeholder="example.com"
                     class="w-full bg-slate-900 border rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                     :class="formErrors.host ? 'border-red-500' : 'border-slate-700'" />
              <p x-show="formErrors.host" x-text="formErrors.host" class="text-red-400 text-xs mt-1"></p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Port</label>
              <input x-model.number="form.port" type="number" placeholder="443" min="1" max="65535"
                     class="w-full bg-slate-900 border rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                     :class="formErrors.port ? 'border-red-500' : 'border-slate-700'" />
              <p x-show="formErrors.port" x-text="formErrors.port" class="text-red-400 text-xs mt-1"></p>
            </div>
          </div>

          <!-- ICMP fields -->
          <div x-show="form.protocol === 'icmp'" class="flex flex-col gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Host / IP</label>
              <input x-model="form.host" type="text" placeholder="1.1.1.1"
                     class="w-full bg-slate-900 border rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                     :class="formErrors.host ? 'border-red-500' : 'border-slate-700'" />
              <p x-show="formErrors.host" x-text="formErrors.host" class="text-red-400 text-xs mt-1"></p>
            </div>
          </div>

          <!-- Interval + Timeout (all protocols) -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Interval (ms)</label>
              <input x-model.number="form.interval_ms" type="number" step="1000"
                     class="w-full bg-slate-900 border rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                     :class="formErrors.interval_ms ? 'border-red-500' : 'border-slate-700'" />
              <p x-show="formErrors.interval_ms" x-text="formErrors.interval_ms" class="text-red-400 text-xs mt-1"></p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Timeout (ms)</label>
              <input x-model.number="form.timeout_ms" type="number" step="1000"
                     class="w-full bg-slate-900 border rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                     :class="formErrors.timeout_ms ? 'border-red-500' : 'border-slate-700'" />
              <p x-show="formErrors.timeout_ms" x-text="formErrors.timeout_ms" class="text-red-400 text-xs mt-1"></p>
            </div>
          </div>

          <!-- General error -->
          <p x-show="formErrors._general" x-text="formErrors._general" class="text-red-400 text-xs"></p>

          <div class="flex gap-3 justify-end pt-2">
            <button type="button" @click="showAddModal = false"
                    class="px-4 py-2 text-sm text-slate-400 hover:text-slate-200 transition-colors">
              Cancel
            </button>
            <button type="submit" :disabled="submitting"
                    class="px-5 py-2 text-sm bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 text-white rounded-lg font-medium transition-colors flex items-center gap-2">
              <i x-show="submitting" class="fa-solid fa-circle-notch fa-spin"></i>
              <span x-text="submitting ? 'Adding…' : 'Add Monitor'"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
