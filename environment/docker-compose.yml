# rusty-pingus reference compose stack.
# Run from the repo root:   docker compose -f environment/docker-compose.yml up
# Or from this directory:   docker compose up
#
# Before starting, create a config/ directory next to this file and copy
# config.toml from the repo root into it. Monitors are stored in the database
# (under ./data) and managed via the web UI/API — no monitors file is needed.
# (A legacy monitors.toml placed in ./config is imported once on first run.)

services:
  rusty-pingus:
    build:
      context: ..
      dockerfile: Dockerfile
    cap_add:
      - NET_RAW
      - NET_ADMIN
    ports:
      - "${BIND_PORT:-8080}:${BIND_PORT:-8080}"
    volumes:
      # Place config.toml inside ./config/ before starting (monitors live in the DB).
      - ./config:/config
      - ./data:/data
    environment:
      BIND_PORT: ${BIND_PORT:-8080}
      # User/group the app runs as. The entrypoint chowns the mounts to these
      # IDs and drops privileges to them. Defaults match Unraid's nobody:users;
      # set to your host user (e.g. PUID=1000) elsewhere.
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      UMASK: ${UMASK:-022}
    restart: unless-stopped
